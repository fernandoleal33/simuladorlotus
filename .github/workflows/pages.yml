name: Publicar simulador no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v5
      - name: Gerar ícones instaláveis Android e iOS
        run: python3 scripts/generate_icons.py
      - name: Validar parcelas e salvaguardas
        run: node tests/validate.cjs
      - name: Preparar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Enviar arquivos
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
